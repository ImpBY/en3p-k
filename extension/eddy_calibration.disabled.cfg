###############################################################################################################################################################################
# Eddy One-Time Calibration
###############################################################################################################################################################################
# Pluggable module: rename to eddy_calibration.enabled.cfg to activate.
# Needed only for the initial Eddy setup or after replacing the sensor:
# drive current, descend_z and temperature drift calibration.
#
# EDDY_CALIBRATE_PROBE and EDDY_CALIBRATE_DRIFT take their Z reference from a
# nozzle tap (MANUAL_METHOD=tap, Klipper >= v0.13.0-762) instead of the
# TESTZ/ACCEPT paper test. They fall back to the paper test (METHOD=manual)
# while tap_threshold is not calibrated yet, i.e. on a fresh sensor.
#
# Regularly used macros stay in btt_eddy_duo.enabled.cfg:
# EDDY_TAP, EDDY_CALIBRATE_TAP (nozzle change), EDDY_STATUS, EDDY_TEST_PROBE.

[gcode_macro EDDY_CALIBRATE_CURRENT]
description: "Calibrate Eddy drive current. Follow on-screen instructions."
gcode:
  {action_respond_info("=== EDDY DRIVE CURRENT CALIBRATION ===")}

  _SET_SAFE_MOTION
  BED_MESH_CLEAR

  # Home X and Y only
  {action_respond_info("Homing X and Y axes...")}
  G28 X Y

  # Move to center of bed
  G90
  {% set center_x = printer.toolhead.axis_maximum.x / 2 %}
  {% set center_y = printer.toolhead.axis_maximum.y / 2 %}
  G1 X{center_x} Y{center_y} F6000

  {% if 'z' not in printer.toolhead.homed_axes %}
    {action_respond_info("=== MANUAL CALIBRATION REQUIRED ===")}
    {action_respond_info("STEP 1: Use web interface to jog Z axis")}
    {action_respond_info("STEP 2: Lower Z until Eddy probe is ~1mm from bed")}
    {action_respond_info("STEP 3: Run command: LDC_CALIBRATE_DRIVE_CURRENT CHIP=eddy")}
    {action_respond_info("STEP 4: After calibration, run: SAVE_CONFIG")}
    {action_respond_info("===================================")}
  {% else %}
    # If Z is homed, move to safe height
    {action_respond_info("Z axis is homed. Moving to safe height...")}
    G1 Z20 F600
    {action_respond_info("=== MANUAL CALIBRATION REQUIRED ===")}
    {action_respond_info("STEP 1: Lower Z until probe is ~1mm from bed")}
    {action_respond_info("STEP 2: Run: LDC_CALIBRATE_DRIVE_CURRENT CHIP=eddy")}
    {action_respond_info("STEP 3: Run: SAVE_CONFIG")}
    {action_respond_info("===================================")}
  {% endif %}

  _RESTORE_MOTION_LIMITS


[gcode_macro EDDY_CALIBRATE_PROBE]
description: "Calibrate Eddy probe descend_z. Requires homed Z axis. Usage: EDDY_CALIBRATE_PROBE [METHOD=tap|manual]"
gcode:
  {% set method = params.METHOD|default('tap')|lower %}
  {% if method not in ['tap', 'manual'] %}
    {action_raise_error("METHOD must be tap or manual")}
  {% endif %}
  {% set probe_cfg = printer.configfile.settings['probe_eddy_current eddy'] %}
  {% if method == 'tap' and probe_cfg.tap_threshold|default(0)|float <= 0 %}
    {action_respond_info("tap_threshold is not calibrated: using the paper test for the Z reference")}
    {% set method = 'manual' %}
  {% endif %}

  {action_respond_info("Starting Eddy probe calibration (Z reference: %s)..." % method)}

  _SET_SAFE_MOTION
  BED_MESH_CLEAR

  # Require Z to be homed first
  {% if 'z' not in printer.toolhead.homed_axes %}
    {action_respond_info("ERROR: Z axis must be homed first!")}
    {action_respond_info("Run G28 or EDDY_CALIBRATE_CURRENT first")}
    {action_raise_error("Z axis not homed")}
  {% endif %}

  # Home X and Y
  G28 X Y

  # Move to center of bed
  G90
  G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F6000

  # Start height: a tap needs the nozzle 3-20mm above the bed
  G1 Z10 F600

  {% if method == 'manual' %}
    {action_respond_info("Paper test: TESTZ Z=-.1 / Z=+.1 until the paper drags, then ACCEPT")}
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE CHIP=eddy MANUAL_METHOD={method}

  _RESTORE_MOTION_LIMITS


[gcode_macro EDDY_CALIBRATE_DRIFT]
description: "Calibrate Eddy temperature drift compensation. Takes ~30 minutes. Usage: EDDY_CALIBRATE_DRIFT [METHOD=tap|manual] [TARGET=60] [STEP=2]"
# Z reference method of the running calibration; EDDY_CALIBRATE_DRIFT_NEXT
# must request the same method, otherwise Klipper aborts the calibration.
variable_method: "tap"
gcode:
  {% set method = params.METHOD|default('tap')|lower %}
  {% set target = params.TARGET|default(60)|float %}
  {% set step = params.STEP|default(2)|float %}
  {% if method not in ['tap', 'manual'] %}
    {action_raise_error("METHOD must be tap or manual")}
  {% endif %}
  {% set probe_cfg = printer.configfile.settings['probe_eddy_current eddy'] %}
  {% if method == 'tap' and probe_cfg.tap_threshold|default(0)|float <= 0 %}
    {action_respond_info("tap_threshold is not calibrated: using the paper test for the Z reference")}
    {% set method = 'manual' %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=EDDY_CALIBRATE_DRIFT VARIABLE=method VALUE='"{method}"'

  {action_respond_info("=== EDDY TEMPERATURE DRIFT CALIBRATION ===")}
  {action_respond_info("This process will take approximately 30 minutes")}
  {action_respond_info("The probe will heat from ambient to %.0f°C in %.0f°C steps" % (target, step))}
  {% if method == 'tap' %}
    {action_respond_info("Z reference: nozzle tap, samples are taken automatically at every step")}
  {% else %}
    {action_respond_info("Z reference: paper test, every step asks for TESTZ ... ACCEPT")}
  {% endif %}
  {action_respond_info("==========================================")}

  _SET_SAFE_MOTION
  BED_MESH_CLEAR

  # Home all axes
  {action_respond_info("Homing all axes...")}
  G28

  # Optional: Heat bed and extruder for realistic conditions
  # Uncomment if you want to calibrate with heated bed/extruder
  # {action_respond_info("Heating bed to 60°C and extruder to 200°C...")}
  # SET_HEATER_TEMPERATURE HEATER=extruder TARGET=200
  # SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=60
  # TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=60
  # TEMPERATURE_WAIT SENSOR=extruder MINIMUM=200

  # Move to center and lower to the first-sample height: a tap needs the
  # nozzle 3-20mm above the bed, the paper test starts close to it. Later
  # samples start from resting_z of [temperature_probe eddy].
  {% set center_x = printer.toolhead.axis_maximum.x / 2 %}
  {% set center_y = printer.toolhead.axis_maximum.y / 2 %}
  G1 X{center_x} Y{center_y} F6000
  {% if method == 'tap' %}
    G1 Z5 F600
  {% else %}
    G1 Z1 F600
  {% endif %}

  {action_respond_info("Starting temperature calibration...")}
  {action_respond_info("Current probe temp: %.1f°C" % printer['temperature_probe eddy'].temperature)}
  {action_respond_info("Target: %.0f°C in %.0f°C steps" % (target, step))}

  TEMPERATURE_PROBE_CALIBRATE PROBE=eddy TARGET={target} STEP={step} MANUAL_METHOD={method}

  {action_respond_info("==========================================")}
  {action_respond_info("Drift calibration started!")}
  {action_respond_info("Monitor progress in console")}
  {action_respond_info("==========================================")}


[gcode_macro EDDY_CALIBRATE_DRIFT_NEXT]
description: "Force the next drift sample before the temperature step is reached"
gcode:
  {% set method = printer["gcode_macro EDDY_CALIBRATE_DRIFT"].method %}
  {% if printer['temperature_probe eddy'] %}
    {action_respond_info("Current probe temperature: %.1f°C" % printer['temperature_probe eddy'].temperature)}
    {action_respond_info("Taking the next sample now (%s)..." % method)}
  {% endif %}

  TEMPERATURE_PROBE_NEXT MANUAL_METHOD={method}

  {action_respond_info("Waiting for temperature stabilization...")}
  {action_respond_info("This may take several minutes per step")}


[gcode_macro EDDY_CALIBRATE_DRIFT_STOP]
description: "Complete and save drift calibration"
gcode:
  {action_respond_info("=== COMPLETING DRIFT CALIBRATION ===")}

  # Complete calibration
  TEMPERATURE_PROBE_COMPLETE

  {action_respond_info("Drift calibration completed!")}
  {action_respond_info("Shutting down heaters and motors...")}

  # Turn off heaters and part cooling fan
  _SYSTEMS_OFF HEATERS=1 FANS=1 MOTORS=0

  # Wait a moment for heaters to start cooling
  G4 P2000

  # Turn off motors
  _SYSTEMS_OFF HEATERS=0 FANS=0 MOTORS=1

  {action_respond_info("==========================================")}
  {action_respond_info("IMPORTANT: Run SAVE_CONFIG to save calibration!")}
  {action_respond_info("After restart, your Eddy will be fully calibrated")}
  {action_respond_info("==========================================")}


[gcode_macro EDDY_CALIBRATE_ALL]
description: "Complete Eddy calibration sequence (interactive guide)"
gcode:
  {action_respond_info("╔============================================╗")}
  {action_respond_info("║  EDDY COMPLETE CALIBRATION SEQUENCE        ║")}
  {action_respond_info("╚============================================╝")}
  {action_respond_info("")}
  {action_respond_info("This wizard will guide you through all calibration steps:")}
  {action_respond_info("  1. Drive Current Calibration (~5 minutes)")}
  {action_respond_info("  2. Descend Z Calibration (~5 minutes)")}
  {action_respond_info("  3. Tap Threshold Calibration (~5 minutes)")}
  {action_respond_info("  4. Temperature Drift Calibration (~30 minutes)")}
  {action_respond_info("")}
  {action_respond_info("Total time: ~45 minutes")}
  {action_respond_info("===============================================")}
  {action_respond_info("")}

  # Check if Eddy is connected
  {% if 'probe_eddy_current eddy' not in printer %}
    {action_respond_info("ERROR: Eddy MCU not connected!")}
    {action_respond_info("Check USB connection and restart Klipper")}
    {action_raise_error("Eddy MCU not found")}
  {% endif %}

  {action_respond_info("┌─────────────────────────────────────────────┐")}
  {action_respond_info("│ STEP 1/3: DRIVE CURRENT CALIBRATION         │")}
  {action_respond_info("└─────────────────────────────────────────────┘")}
  {action_respond_info("")}

  EDDY_CALIBRATE_CURRENT

  {action_respond_info("")}
  {action_respond_info("===============================================")}
  {action_respond_info("NEXT STEPS:")}
  {action_respond_info("  1. Complete the drive current calibration above")}
  {action_respond_info("  2. Run: SAVE_CONFIG")}
  {action_respond_info("  3. After Klipper restarts, run: EDDY_CALIBRATE_PROBE")}
  {action_respond_info("     (paper test on a fresh sensor, nozzle tap once tap_threshold exists)")}
  {action_respond_info("  4. Then run: SAVE_CONFIG again")}
  {action_respond_info("  5. After restart, run: EDDY_CALIBRATE_TAP STAGE=guess, then refine, then verify")}
  {action_respond_info("  6. Then run: SAVE_CONFIG again")}
  {action_respond_info("  7. After restart, run: EDDY_CALIBRATE_DRIFT (samples by nozzle tap)")}
  {action_respond_info("  8. Finally run: SAVE_CONFIG one last time")}
  {action_respond_info("===============================================")}
